#!/usr/sbin/nft -f
#
# Kavach host egress policy (§02.1).
#
# Default DROP on OUTPUT with an explicit, named counter so the sentinel can read
# the kernel's own count of what it refused - which is what makes the dashboard's
# number a measurement rather than an assertion.
#
#   sudo nft -f deploy/nftables.conf
#   sudo nft list counter inet kavach egress_drop
#
# Applying this on your dev laptop WILL cut that machine off the network. Run it on
# the demo box, or inside a VM. `sudo nft delete table inet kavach` reverses it.

table inet kavach {

    counter egress_drop  { }
    counter egress_local { }

    chain output {
        type filter hook output priority filter; policy drop;

        # Loopback: the gateway, the UI and the sentinel all talk over it.
        oifname "lo" counter name egress_local accept

        # The kavach_core bridge and its veth pairs. Intra-stack traffic only -
        # the bridge is `internal: true` so it has no route off the box.
        oifname "br-*"  counter name egress_local accept
        oifname "veth*" counter name egress_local accept

        # Established flows belonging to the accepted traffic above.
        ct state established,related counter name egress_local accept

        # Everything else is refused, counted, and logged. The log line is what
        # the dashboard tails during the canary beat.
        counter name egress_drop \
            log prefix "kavach-egress-drop: " level warn flags all \
            reject with icmpx type admin-prohibited
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Container-to-container inside the internal bridge, nothing beyond it.
        iifname "br-*" oifname "br-*"   counter accept
        iifname "veth*" oifname "veth*" counter accept

        counter name egress_drop \
            log prefix "kavach-forward-drop: " level warn flags all \
            reject with icmpx type admin-prohibited
    }
}

# Why `reject` rather than a silent `drop`:
# a rejection returns ENETUNREACH/EPERM immediately, so the canary gets a
# DEFINITIVE verdict instead of an ambiguous timeout. A silent drop looks
# identical to an unplugged cable, and proves nothing to a judge.
