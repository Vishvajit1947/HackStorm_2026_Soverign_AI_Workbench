# ---- staged on this box: Intel Arc iGPU, shared system memory ----
#
# Added for the ARC profile. Unlike the entries above, this one is expected to
# have a real GGUF behind it - stage the file, then:
#   python scripts/stage_model.py --write --only qwen2_5-7b-instruct
#
# vram_gb is what the WARDEN budgets against, and on a shared-memory iGPU that
# is system RAM, not a dedicated pool. 5.0 is the Q4_K_M file plus working set;
# it is a claim from this manifest, not a measured allocation (see R1).
#
# tok_per_s is deliberately pessimistic. A 7B at Q4 on an iGPU is single-digit
# tokens per second, and the router's latency term should reflect that rather
# than a discrete-GPU number that would make every routing decision wrong.
- id: qwen2_5-7b-instruct
  file: qwen2.5-7b-instruct-q4_k_m.gguf
  sha256: 4e9221217000d0fc8f5ffdbae51a7201fcc3613de18ff1b1cd8c7c01f924437b
  license: apache-2.0
  tier: 2
  capabilities: [text, tools, reasoning]
  context: 8192
  # 4.6, not 5.0. The file is qwen2.5-7b-instruct-q4_k_m.gguf at 4.36 GB on
  # disk - the same quantisation and the same size as qwen2.5-coder-7b, which
  # declares 4.6 and loads on this card with room to spare. The 5.0 here was a
  # guess, and it was the reason this model could not be listed in a profile
  # budgeted for a 6 GB card: every prose task then went to the coder.
  vram_gb: 4.6
  # Both of these were guesses that made this model look slower than it is, and
  # the router's latency term is where that showed: at 6 tok/s it lost
  # doc_summary to the coder on SPEED despite a better quality score. Two files
  # of the same architecture family, the same q4_k_m quantisation and the same
  # 4.36 GB cannot differ six-fold in throughput; seeded at the coder's figure
  # until scripts/eval_harness.py measures both on this card.
  load_ms: 4200
  tok_per_s: 38
  quality:
    code_generation: 0.72
    doc_summary: 0.80
    numerical_calc: 0.71
    official_drafting: 0.80
    kb_qa: 0.79
    visual_doc: 0.00        # no vision tower -> hard-eliminated by stage 1
    agentic_multi: 0.74

