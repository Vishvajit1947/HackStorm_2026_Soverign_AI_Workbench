# Labelled examples for the router's kNN classifier (§04, stage 2).
#
# THIS FILE IS THE ROUTER'S TRAINING DATA. Improving the router means adding
# examples here, not retraining a model - when a routing decision is wrong in
# rehearsal, paste the prompt under the right label and it is fixed in seconds.
#
# The architecture doc suggests 300-500 examples. This is a seed of ~130. Add to
# it from your own rehearsal transcripts; that is the cheapest accuracy you will
# ever buy.
#
# Keep the phrasing close to how a plant engineer actually types - short, tag
# numbers inline, imperative mood.

code_generation:
  - "Script the NPSH-available calculation and unit-test it"
  - "Write a Python function to compute Reynolds number from flow rate and pipe ID"
  - "Generate a script that parses the daily tank dip readings into a CSV"
  - "Write code to interpolate steam table values between 10 and 15 bar"
  - "Implement the Colebrook-White friction factor solver with tests"
  - "Refactor this function so it handles a zero flow rate without dividing by zero"
  - "Write a parser for the DCS alarm log export"
  - "Give me a script that validates instrument tag numbers against the ISA format"
  - "Debug this loop - it returns the wrong pressure drop for laminar flow"
  - "Write unit tests for the pump efficiency calculation"
  - "Create a Python class representing a heat exchanger with LMTD methods"
  - "Automate the conversion of the vibration data from mm/s to inches per second"
  - "Write a function that flags any reading outside two standard deviations"
  - "Generate code to batch-rename the inspection photos by equipment tag"
  - "Fix the off-by-one error in the shift rota generator"
  - "Write a script to reconcile the material balance across the crude unit"
  - "Implement a binary search over the sorted tag list"
  - "Add error handling to this file reader so a missing column does not crash it"
  - "Write a regex that extracts PSV tag numbers from free text"
  - "Port this Excel formula into a Python function"
  # Casual / indirect phrasing. The eval set showed the class was under-covered
  # here and these requests were being swallowed by agentic_multi, whose longer
  # prototypes match more loosely. Distinct subject matter from eval_tasks.yaml
  # on purpose - covering the phrasing space, not memorising the test.
